name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example mc1.21.1-v1.0.0"
        required: true
        type: string
      release_type:
        description: "CurseForge release type"
        required: true
        default: release
        type: choice
        options:
          - release
          - beta
          - alpha
      dry_run:
        description: "Build and verify release files without publishing"
        required: true
        default: true
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Validate tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^mc1\.21\.1-v[0-9A-Za-z.+_-]+$ ]]; then
            echo "Tag must look like mc1.21.1-v1.0.0"
            exit 1
          fi

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="$RELEASE_TAG"
          version="${version#mc1.21.1-v}"
          jar="build/libs/midviewcell-neoforge-1.21.1-${version}.jar"
          sources_jar="build/libs/midviewcell-neoforge-1.21.1-${version}-sources.jar"
          dev_jar="build/libs/midviewcell-neoforge-1.21.1-${version}-dev.jar"

          if [[ ! -f "$jar" ]]; then
            echo "Expected release jar was not built: $jar"
            echo "Built jars:"
            find build/libs -maxdepth 1 -name "*.jar" -print
            exit 1
          fi

          for extra_jar in "$sources_jar" "$dev_jar"; do
            if [[ ! -f "$extra_jar" ]]; then
              echo "Expected extra jar was not built: $extra_jar"
              echo "Built jars:"
              find build/libs -maxdepth 1 -name "*.jar" -print
              exit 1
            fi
          done

          if find build/libs -maxdepth 1 -name "*NO-GIT-TAG-SET*.jar" | grep -q .; then
            echo "Refusing to publish a NO-GIT-TAG-SET build."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "jar=$jar" >> "$GITHUB_OUTPUT"
          echo "sources_jar=$sources_jar" >> "$GITHUB_OUTPUT"
          echo "dev_jar=$dev_jar" >> "$GITHUB_OUTPUT"

      - name: Upload dry run artifacts
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-${{ inputs.tag }}
          path: |
            ${{ steps.meta.outputs.jar }}
            ${{ steps.meta.outputs.sources_jar }}
            ${{ steps.meta.outputs.dev_jar }}
          if-no-files-found: error

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        shell: bash
        run: |
          {
            echo "## Dry run completed"
            echo ""
            echo "No files were published to CurseForge or GitHub Releases."
            echo ""
            echo "Verified files:"
            echo "- ${{ steps.meta.outputs.jar }}"
            echo "- ${{ steps.meta.outputs.sources_jar }}"
            echo "- ${{ steps.meta.outputs.dev_jar }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to CurseForge and GitHub
        if: ${{ !inputs.dry_run }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1456030
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-files: ${{ steps.meta.outputs.jar }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ inputs.tag }}
          github-files: |
            ${{ steps.meta.outputs.jar }}
            ${{ steps.meta.outputs.sources_jar }}
            ${{ steps.meta.outputs.dev_jar }}
          name: "Mod ID View Cell ${{ steps.meta.outputs.version }} for Minecraft 1.21.1"
          version: ${{ steps.meta.outputs.version }}
          version-type: ${{ inputs.release_type }}
          changelog-file: CHANGELOG.md
          loaders: neoforge
          game-versions: 1.21.1
          java: 21
          fail-mode: fail
