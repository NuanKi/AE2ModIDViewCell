name: Publish Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Release line to publish"
        required: true
        default: "1.21.1-neoforge"
        type: choice
        options:
          - "1.21.1-neoforge"
          - "1.12.2-forge"
      tag:
        description: "Release tag, for example mc1.21.1-v1.0.0 or v1.1.5"
        required: true
        type: string
      release_type:
        description: "CurseForge release type"
        required: true
        default: release
        type: choice
        options:
          - release
          - beta
          - alpha
      dry_run:
        description: "Build and verify release files without publishing"
        required: true
        default: true
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve target metadata
        id: target
        shell: bash
        env:
          RELEASE_TARGET: ${{ inputs.target }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          case "$RELEASE_TARGET" in
            "1.21.1-neoforge")
              if [[ ! "$RELEASE_TAG" =~ ^mc1\.21\.1-v[0-9A-Za-z.+_-]+$ ]]; then
                echo "1.21.1 NeoForge tags must look like mc1.21.1-v1.0.0"
                exit 1
              fi
              version="${RELEASE_TAG#mc1.21.1-v}"
              archive_base="midviewcell-neoforge-1.21.1"
              game_version="1.21.1"
              loader="neoforge"
              java_version="21"
              release_name="Mod ID View Cell ${version} for Minecraft 1.21.1 NeoForge"
              ;;
            "1.12.2-forge")
              if [[ ! "$RELEASE_TAG" =~ ^v[0-9A-Za-z.+_-]+$ ]]; then
                echo "1.12.2 Forge tags must look like v1.1.5"
                exit 1
              fi
              version="${RELEASE_TAG#v}"
              archive_base="ae2-modIdViewCell-1.12.2"
              game_version="1.12.2"
              loader="forge"
              java_version="8"
              release_name="AE2 ModID View Cell ${version} for Minecraft 1.12.2 Forge"
              ;;
            *)
              echo "Unknown release target: $RELEASE_TARGET"
              exit 1
              ;;
          esac

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive_base=$archive_base" >> "$GITHUB_OUTPUT"
          echo "game_version=$game_version" >> "$GITHUB_OUTPUT"
          echo "loader=$loader" >> "$GITHUB_OUTPUT"
          echo "java_version=$java_version" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Resolve release files
        id: files
        shell: bash
        env:
          ARCHIVE_BASE: ${{ steps.target.outputs.archive_base }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          jar="build/libs/${ARCHIVE_BASE}-${VERSION}.jar"
          sources_jar="build/libs/${ARCHIVE_BASE}-${VERSION}-sources.jar"
          dev_jar="build/libs/${ARCHIVE_BASE}-${VERSION}-dev.jar"

          if [[ ! -f "$jar" ]]; then
            echo "Expected release jar was not built: $jar"
            echo "Built jars:"
            find build/libs -maxdepth 1 -name "*.jar" -print
            exit 1
          fi

          for extra_jar in "$sources_jar" "$dev_jar"; do
            if [[ ! -f "$extra_jar" ]]; then
              echo "Expected extra jar was not built: $extra_jar"
              echo "Built jars:"
              find build/libs -maxdepth 1 -name "*.jar" -print
              exit 1
            fi
          done

          if find build/libs -maxdepth 1 -name "*NO-GIT-TAG-SET*.jar" | grep -q .; then
            echo "Refusing to publish a NO-GIT-TAG-SET build."
            exit 1
          fi

          echo "jar=$jar" >> "$GITHUB_OUTPUT"
          echo "sources_jar=$sources_jar" >> "$GITHUB_OUTPUT"
          echo "dev_jar=$dev_jar" >> "$GITHUB_OUTPUT"

      - name: Upload dry run artifacts
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-${{ inputs.target }}-${{ inputs.tag }}
          path: |
            ${{ steps.files.outputs.jar }}
            ${{ steps.files.outputs.sources_jar }}
            ${{ steps.files.outputs.dev_jar }}
          if-no-files-found: error

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        shell: bash
        run: |
          {
            echo "## Dry run completed"
            echo ""
            echo "No files were published to CurseForge or GitHub Releases."
            echo ""
            echo "Target: ${{ inputs.target }}"
            echo "Tag: ${{ inputs.tag }}"
            echo "Game version: ${{ steps.target.outputs.game_version }}"
            echo "Loader: ${{ steps.target.outputs.loader }}"
            echo ""
            echo "Verified files:"
            echo "- ${{ steps.files.outputs.jar }}"
            echo "- ${{ steps.files.outputs.sources_jar }}"
            echo "- ${{ steps.files.outputs.dev_jar }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to CurseForge and GitHub
        if: ${{ !inputs.dry_run }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1456030
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-files: ${{ steps.files.outputs.jar }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ inputs.tag }}
          github-files: |
            ${{ steps.files.outputs.jar }}
            ${{ steps.files.outputs.sources_jar }}
            ${{ steps.files.outputs.dev_jar }}
          name: ${{ steps.target.outputs.release_name }}
          version: ${{ steps.target.outputs.version }}
          version-type: ${{ inputs.release_type }}
          changelog-file: CHANGELOG.md
          loaders: ${{ steps.target.outputs.loader }}
          game-versions: ${{ steps.target.outputs.game_version }}
          java: ${{ steps.target.outputs.java_version }}
          fail-mode: fail
